<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ic = (n, c = 'i') => `<svg class="${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = a => a[Math.floor(rnd() * a.length)];
const DAY = 864e5, NOW = Date.now();
const ago = t => { const d = (NOW - t) / DAY; return d < 1 ? Math.max(1, Math.round(d * 24)) + ' h ago' : Math.round(d) + ' d ago'; };

/* ============ Mock memories (~150) ============ */
const TOPICS = [
  ['Build and CI', ['nx cache policy', 'verify lock slots', 'husky hooks', 'ci test shards', 'affected targets']],
  ['Electron host', ['sandbox flags', 'ipc sender policy', 'window guards', 'preload surface', 'worker bundles']],
  ['Chat UX', ['transcript motion', 'composer shortcuts', 'tab restore', 'streaming markdown']],
  ['Providers', ['model aliases', 'oauth refresh', 'copilot adapter', 'codex runtime']],
  ['User preferences', ['commit style', 'sentence case copy', 'worktree per task', 'no emoji']],
  ['Design system', ['ptah-select menu', 'floating label', 'gold primary', 'state ink tokens']],
];
const KINDS = ['fact', 'preference', 'event', 'entity'], TIERS = ['core', 'recall', 'archival'];
const SESS = Array.from({ length: 8 }, (_, i) => 'sess-' + (0x4a10 + i * 0x37).toString(16));
const TV = TOPICS.map(() => Array.from({ length: 6 }, () => rnd() * 2 - 1));
let MEM = [];
TOPICS.forEach((t, ti) => t[1].forEach((subj, si) => { const n = 5 + Math.floor(rnd() * 4);
  for (let k = 0; k < n && MEM.length < 150; k++) {
    const tier = rnd() < .16 ? 'core' : rnd() < .6 ? 'recall' : 'archival';
    const age = Math.floor(rnd() * rnd() * 90), kind = rnd() < .45 ? 'fact' : pick(KINDS);
    MEM.push({ id: 'm' + String(MEM.length + 1).padStart(3, '0'), topic: t[0], ti, subject: subj, kind, tier,
      salience: +(.2 + rnd() * .78).toFixed(2), hits: Math.floor(rnd() * rnd() * 40), pinned: tier === 'core' && rnd() < .45,
      createdAt: NOW - (age + 1) * DAY, updatedAt: NOW - age * DAY * .8, lastUsedAt: NOW - Math.floor(rnd() * Math.min(age + 1, 20)) * DAY,
      sessionId: SESS[(ti + Math.floor(rnd() * 3)) % 8], workspace: rnd() < .9 ? 'ptah-extension' : 'ptah-landing-page',
      vec: TV[ti].map(x => x + (rnd() - .5) * 1.1),
      content: `${pick(['Decision', 'Observed', 'Rule', 'Note', 'Agreed'])}: ${subj} ${pick(['must stay stable across hosts', 'is checked before every push', 'changed after the last review', 'is owned by one library', 'needs a regression test', 'should use the shared component'])}.` });
  } }));
const cos = (a, b) => { let d = 0, x = 0, y = 0; for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; x += a[i] * a[i]; y += b[i] * b[i]; } return d / Math.sqrt(x * y); };
const EDGES = [];
function buildEdges() { EDGES.length = 0; const ix = new Map(MEM.map(m => [m.id, m]));
  MEM.forEach(a => { MEM.map(b => [b, cos(a.vec, b.vec)]).filter(([b]) => b !== a).sort((x, y) => y[1] - x[1]).slice(0, 4).forEach(([b, w]) => { if (a.id < b.id || !EDGES.some(e => e.type === 'semantic' && e.s === b.id && e.t === a.id)) EDGES.push({ s: a.id, t: b.id, type: 'semantic', w: +w.toFixed(2) }); }); });
  const chain = (key, type) => { const g = {}; MEM.forEach(m => (g[m[key]] ||= []).push(m)); Object.values(g).forEach(l => { l.sort((a, b) => a.createdAt - b.createdAt); for (let i = 1; i < l.length; i++) EDGES.push({ s: l[i - 1].id, t: l[i].id, type, w: 1 }); }); };
  chain('subject', 'subject'); chain('sessionId', 'session'); }
buildEdges();
const MIN_T = NOW - 91 * DAY;

/* ============ State ============ */
const S = {
  panel: 'memory', width: 1168, data: 'loaded', mview: 'graph', paused: false, telemetry: true,
  tiers: new Set(TIERS), kinds: new Set(KINDS), pinned: false, scope: 'workspace', session: 'all', from: 0, to: 100,
  edge: { semantic: true, subject: true, session: false }, thr: .75, colorBy: 'kind', sizeBy: 'salience', clusterBy: 'subject', cluster: false, freeze: false, labels: true,
  sel: new Set(), hover: null, q: '', confirm: false, page: 0, sort: 'salience', listQ: '',
  sk: { tab: 'agent', filter: 'all', q: '', sort: 'name', open: null, paused: false, telemetry: true, editing: false },
};
const OPTS = {
  colorBy: [['kind', 'Kind'], ['tier', 'Tier'], ['session', 'Session'], ['topic', 'Subject group']],
  sizeBy: [['salience', 'Salience'], ['hits', 'Hits'], ['uniform', 'Uniform']],
  clusterBy: [['subject', 'Subject'], ['kind', 'Kind'], ['session', 'Session']],
  scope: [['workspace', 'This workspace'], ['all', 'All workspaces']],
  session: [['all', 'All sessions'], ...SESS.map(s => [s, s])],
};
const optLabel = (k, v) => (((k.startsWith('sk:') ? SK_OPTS[k] : OPTS[k]) || []).find(o => o[0] === v) || [])[1];
const KCOL = { fact: 'var(--graph-fact)', preference: 'var(--graph-preference)', event: 'var(--graph-event)', entity: 'var(--graph-entity)' };

/* ============ Shared widgets ============ */
function selHTML(key, label, val, opts) { const v = opts ? opts : OPTS[key];
  return `<div class="field" data-sel="${key}"><div class="field-box"><span class="field-label">${label}</span><button class="sel-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="${label}"><span>${esc(optLabel(key, val) ?? val)}</span>${ic('chev', 'i i-sm')}</button></div></div>`; }
let openSel = null;
function closeSel() { if (openSel) { openSel.remove(); openSel = null; $$('.sel-btn[aria-expanded=true]').forEach(b => b.setAttribute('aria-expanded', 'false')); } }
document.addEventListener('click', e => {
  const b = e.target.closest('.sel-btn');
  if (!b) { if (!e.target.closest('.sel-list')) closeSel(); return; }
  const f = b.closest('[data-sel]'), key = f.dataset.sel, wasOpen = openSel && openSel.parentElement === f; closeSel(); if (wasOpen) return;
  const list = key.startsWith('sk:') ? SK_OPTS[key] : OPTS[key], cur = key.startsWith('sk:') ? S.sk[key.slice(3)] : S[key];
  const ul = document.createElement('ul'); ul.className = 'sel-list'; ul.setAttribute('role', 'listbox');
  ul.innerHTML = list.map(([v, l]) => `<li role="option" data-v="${esc(v)}" aria-selected="${v === cur}">${esc(l)}</li>`).join('');
  f.appendChild(ul); openSel = ul; b.setAttribute('aria-expanded', 'true');
  ul.addEventListener('click', ev => { const li = ev.target.closest('li'); if (!li) return; if (key.startsWith('sk:')) S.sk[key.slice(3)] = li.dataset.v; else S[key] = li.dataset.v; closeSel(); onSel(key); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSel(); });
const SK_OPTS = { 'sk:sort': [['name', 'Name'], ['used', 'Most used'], ['success', 'Success rate'], ['enhanced', 'Recently enhanced']] };
function onSel(key) { if (key.startsWith('sk:')) return renderPanel(); if (key === 'scope' || key === 'session') applyFilters(true); else { if (key === 'clusterBy') seedCluster(); updateGraphUI(); } if (key === 'colorBy' || key === 'sizeBy') drawAll(); }

/* ============ Shell ============ */
function renderTiles() {
  const defs = [['memory', 'brain', 'Memory', '150 facts', S.paused ? 'Paused' : '2 queued for curation'], ['skills', 'spark', 'Skills', '27 entries', '3 diverged'], ['cron', 'cal', 'Schedules', '4 active', 'Next run in 12 min'], ['gateway', 'msg', 'Messaging', '2 bots', 'All connected']];
  $('#tiles').innerHTML = defs.map(([id, i, l, v, d]) => `<button class="tile" role="tab" aria-selected="${S.panel === id}" data-id="${id}" ${['cron', 'gateway'].includes(id) ? 'disabled style="opacity:.55;cursor:default"' : ''}>${ic(i)}<span class="lab">${l}</span><span class="val num">${v}</span><span class="desc">${(id === 'memory' && S.paused) || (id === 'skills' && S.sk.paused) ? 'Paused' : d}</span></button>`).join('');
}
$('#tiles').addEventListener('click', e => { const t = e.target.closest('.tile'); if (t && !t.disabled) { S.panel = t.dataset.id; sync(); } });

/* ============ Panel router ============ */
function renderPanel() { stopLoop(); closeSel(); renderTiles(); $('#panel').innerHTML = S.panel === 'memory' ? memoryHTML() : skillsHTML(); if (S.panel === 'memory') bindMemory(); else bindSkills(); }

/* ============ MEMORY ============ */
const tg = (id, label, on, extra = '') => `<label class="tg"><input type="checkbox" class="toggle" id="${id}" ${on ? 'checked' : ''} ${extra}><span>${label}</span></label>`;
function memoryHTML() {
  const views = [['graph', 'Graph'], ['list', 'List'], ['timeline', 'Timeline'], ['boards', 'Boards'], ['code', 'Code index'], ['health', 'Health']];
  const nows = S.data === 'nows';
  return `<div class="phead"><div><h1 class="t-page">Memory</h1><p>Facts, events, and code Thoth has learned across sessions.</p></div>
    <div class="tgrp">${tg('pause', S.paused ? 'Memory is paused' : 'Memory is on', !S.paused)}</div></div>
    ${S.paused ? `<div class="alert" data-tone="warn">${ic('warn')}<div class="txt"><strong>Memory is paused.</strong> Capture, background processing and Run curator now are off. Saved memories are still used in chats.</div></div>` : ''}
    <ol class="band" aria-label="Memory tier statistics">
      ${[['Core', S.data === 'empty' ? 0 : 24, 'var(--p)'], ['Recall', S.data === 'empty' ? 0 : 78, 'var(--edge-strong)'], ['Archival', S.data === 'empty' ? 0 : 48, 'var(--faint)'], ['Code index', '1,204', 'var(--state-ink-run)'], ['Last curated', S.data === 'empty' ? 'never' : '4 min ago', 'var(--state-ink-done)']].map(([l, v, c]) => `<li style="--ink:${c}"><div class="bar"></div><div class="v num">${v}</div><div class="l">${l}</div></li>`).join('')}
    </ol>
    <div class="viewbar"><div class="tabs" role="tablist" aria-label="Memory views">${views.map(([v, l]) => `<button role="tab" aria-selected="${S.mview === v}" data-view="${v}">${l}</button>`).join('')}</div>
      <span class="hint" id="matchline"></span></div>
    <div id="mbody">${nows ? noWorkspace() : S.mview === 'graph' ? graphHTML() : S.mview === 'list' ? listHTML() : paneHTML(S.mview)}</div>`;
}
function noWorkspace() { return `<div class="stateblock listwrap" style="min-height:20rem">${ic('brain')}<h3>No workspace is open</h3><p>Memory is scoped to a workspace. Open a folder, or view memories from all workspaces.</p><button class="btn" data-v="secondary" data-s="sm" id="allws">Show all workspaces</button></div>`; }

  const p = $('#panel'); if (p._ev) return; p._ev = 1;
  p.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-bulk],[data-focus],[data-rowact],[data-sort],[data-page]'); if (!t) return;
    const id = S.sel.size === 1 ? [...S.sel][0] : null;
    if (t.dataset.act === 'close') { select(null); }
    if (t.dataset.act === 'pin' && id) mutate([id], MEM.find(m => m.id === id).pinned ? 'unpin' : 'pin');
    if (t.dataset.act === 'session' && id) toast('Opening source session ' + MEM.find(m => m.id === id).sessionId);
    if (t.dataset.act === 'forget') { S.confirm = true; updateInspector(); }
    if (t.dataset.act === 'forget-no') { S.confirm = false; updateInspector(); }
    if (t.dataset.act === 'forget-yes' && id) mutate([id], 'forget');
    if (t.dataset.bulk) { const ids = [...S.sel]; if (t.dataset.bulk === 'clear') select(null); else mutate(ids, t.dataset.bulk); }
    if (t.dataset.focus) { select(t.dataset.focus); if (S.mview === 'graph') focusNode(t.dataset.focus, false); }
    if (t.dataset.rowact) { const rid = t.closest('tr').dataset.id; if (t.dataset.rowact === 'forget') { S.sel.clear(); S.sel.add(rid); S.confirm = true; renderList(); } else mutate([rid], MEM.find(m => m.id === rid).pinned ? 'unpin' : 'pin'); }
    if (t.dataset.sort) { S.sort = t.dataset.sort; renderList(); }
    if (t.dataset.page) { S.page += +t.dataset.page; renderList(); }
  });
}
function bindList() {
  renderList();
  $('#lsearch').oninput = e => { S.listQ = e.target.value; S.page = 0; renderList(); };

}

    <div class="listwrap" style="padding:0 .75rem .5rem">${rows.length ? `<table class="tbl"><thead><tr><th>Name</th><th>Status</th><th class="num">Runs</th><th>Success</th><th>Last enhanced</th>${k.tab === 'agent' ? '<th>Provider copies</th>' : ''}<th></th></tr></thead><tbody>${rows.map(s => `<tr tabindex="0" data-slug="${s.slug}"><td><div class="ttl mono">${s.slug}</div><div class="sub">${s.prov}</div></td>

  return `<div class="phead"><div><h1 class="t-page">Skills</h1><p>Manage your Skills, Agents and Commands Library.</p></div>

  <section><div class="sec-title">History (${s.hist})</div>${s.hist ? `<ol class="hist">${Array.from({ length: Math.min(3, s.hist) }, (_, i) => `<li><span>${s.enh + i * 6} days ago</span><span class="actions"><button class="btn" data-v="ghost" data-s="xs">Diff</button><button class="btn" data-v="outline" data-s="xs">Revert to this</button></span></li>`).join('')}</ol>` : '<p class="hint">No snapshots yet. One is written every time this entry is enhanced or rebased.</p>'}</section></div></aside>`; }
function bindSkills() { const p = $('#panel'), k = S.sk;
  $('#skpause').onchange = e => { k.paused = !e.target.checked; renderPanel(); }; $('#sktel').onchange = e => { k.telemetry = e.target.checked; renderPanel(); };

  $$('[data-skf]', p).forEach(b => b.onclick = () => { k.filter = b.dataset.skf; renderPanel(); });
  const q = $('#skq'); if (q) q.oninput = e => { k.q = e.target.value; const pos = e.target.selectionStart; renderPanel(); const n = $('#skq'); n.focus(); n.setSelectionRange(pos, pos); };
  p.onclick = e => { const t = e.target.closest('[data-skact]'); if (!t) return; const a = t.dataset.skact, tr = t.closest('tr');
    if (a === 'open') k.open = tr.dataset.slug; if (a === 'close') { k.open = null; k.editing = false; } if (a === 'edit') k.editing = true; if (a === 'canceledit' || a === 'save') k.editing = false; if (a === 'enh') k.open = tr.dataset.slug;
    renderPanel(); };
  $$('tr[data-slug]', p).forEach(tr => tr.onkeydown = e => { if (e.key === 'Enter') { k.open = tr.dataset.slug; renderPanel(); } });

if (qp.get('tab')) S.sk.tab = qp.get('tab'); if (qp.get('open')) S.sk.open = qp.get('open'); if (qp.get('cluster')) S.cluster = true;

new ResizeObserver(compact).observe($('#app')); compact();
if (qp.get('chrome') === 'off') { const t = document.querySelector('.proto'); if (t) t.style.display = 'none'; }
window.__thoth = { S, G, select, focusNode, fit };
sync();
if (qp.get('select')) setTimeout(() => { focusNode(qp.get('select'), false); }, 600);
})();
