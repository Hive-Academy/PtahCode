<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session inspector v3 prototype</title>
<style>
/* Token values copied from tailwind.config.js (themes anubis / anubis-light),
   apps/ptah-extension-webview/src/styles.css (--surface-*, --ptah-gold) and
   libs/frontend/ui/src/lib/tokens/ptah-tokens.css (--ptah-series-*, spacing, type). */
:root,[data-theme="anubis"]{
  --b1:#131317;--b2:#1a1a20;--b3:#242430;--bc:#e8e6e1;--bcm:oklch(66.509856% 0.007403 31.090978);
  --st-run:#3b82f6;--st-need:#f97316;--st-err:#ef4444;--st-done:#16a34a;--st-idle:#9ca3af;
  --gold:#d4af37;--series-1:oklch(78% 0.14 85);--series-2:oklch(76% 0.12 180);
  --r-box:.75rem;--r-btn:.375rem;--r-chip:.25rem;--hl:13%;
  --shadow-raised:0 12px 30px oklch(0% 0 0 / .42);
}
[data-theme="anubis-light"]{
  --b1:oklch(97.788% 0.004 56.375);--b2:oklch(93.982% 0.007 61.449);--b3:oklch(91.586% 0.006 53.44);
  --bc:oklch(23.574% 0.066 313.189);--bcm:oklch(48.955188% 0.044796 348.478612);
  --st-run:#2a56c6;--st-need:#8f5200;--st-err:#b4232a;--st-done:#13713a;--st-idle:#6b6570;
  --gold:oklch(58% 0.132 75);--series-1:oklch(52% 0.12 75);--series-2:oklch(50% 0.1 180);
  --r-box:1rem;--r-btn:2rem;--r-chip:1rem;--hl:10%;
  --shadow-raised:0 8px 24px color-mix(in oklch,var(--bc) 18%,transparent);
}
:root,[data-theme]{
  --surface-1:color-mix(in oklch,var(--b2) 88%,var(--b1));--surface-2:var(--b2);
  --surface-3:color-mix(in oklch,var(--b3) 86%,var(--b2));
  --line:color-mix(in oklch,var(--bc) 14%,transparent);
  --line-strong:color-mix(in oklch,var(--bc) 22%,transparent);
  --highlight:color-mix(in oklch,var(--bc) var(--hl),transparent);
  --hover:color-mix(in oklch,var(--bc) 5%,transparent);
  --meter-fill:color-mix(in oklch,var(--bc) 62%,transparent);
  --sp1:.25rem;--sp2:.5rem;--sp3:.75rem;--sp4:1rem;
  --t-val:1.125rem;--t-row:.8125rem;--t-num:.75rem;--t-cap:.6875rem;
  --mono:'JetBrains Mono','Fira Code',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--b2);color:var(--bc);font:400 .75rem/1rem Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--st-run);outline-offset:2px;border-radius:var(--r-btn)}
svg.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* Prototype chrome */
.controls{display:flex;gap:var(--sp3);align-items:center;padding:var(--sp2) var(--sp3);border-bottom:1px solid var(--line);background:var(--b1)}
.controls label{display:flex;gap:var(--sp1);align-items:center;color:var(--bcm)}
.controls select{background:var(--surface-2);color:var(--bc);border:1px solid var(--line-strong);border-radius:var(--r-btn);padding:2px 6px;font:inherit}
.stage{display:flex;justify-content:flex-end;min-height:calc(100% - 37px)}
body.bare .controls{display:none}
html:has(body.bare){scrollbar-width:none}
body.bare .stage{justify-content:flex-start;min-height:100%}

/* Inspector frame */
.insp{container-type:inline-size;position:relative;background:var(--b1);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:100%}
.sec{padding:var(--sp3);border-top:1px solid var(--line);position:relative}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp2);height:1rem;margin-bottom:var(--sp2)}
.sec-h h3{margin:0;font-weight:600;font-size:var(--t-cap);line-height:1rem;letter-spacing:.06em;text-transform:uppercase;color:var(--bc)}
.meta{font-size:var(--t-cap);color:var(--bcm);white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--bcm)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.num .mk{font-style:normal;color:color-mix(in oklch,var(--bc) 74%,transparent);font-weight:500;font-size:.84em;margin-right:2px;display:inline-flex;gap:2px}
.num .mk i{font-style:normal}
.num.unk{color:var(--bcm);font-weight:400}
.link{color:var(--bcm);font-size:var(--t-cap);border-radius:var(--r-btn);padding:1px 4px;margin:-1px -4px}
.link:hover{color:var(--bc);background:var(--hover)}

/* Chip: one style everywhere */
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border:1px solid var(--line);border-radius:var(--r-chip);background:var(--surface-1);font-size:var(--t-cap);line-height:1;color:var(--bcm);white-space:nowrap;min-width:0;max-width:100%}
.chip>span{overflow:hidden;text-overflow:ellipsis;line-height:16px}
.chip svg.ic{width:11px;height:11px}
.chip.mono{font-family:var(--mono);font-size:.625rem}
.chip.st{color:var(--bc)}
.chip.st svg{color:var(--tone)}
button.chip:hover{border-color:var(--line-strong);color:var(--bc)}
button.chip[aria-pressed="true"]{background:var(--highlight);color:var(--bc);border-color:var(--line-strong)}
.t-done{--tone:var(--st-done)}.t-run{--tone:var(--st-run)}.t-err{--tone:var(--st-err)}.t-need{--tone:var(--st-need)}.t-idle{--tone:var(--st-idle)}

/* Bars and rings: one language (3 px bar, pill ends, 2 px gap between segments) */
.bar{display:flex;gap:2px;height:3px;border-radius:999px;background:var(--line-strong);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--meter-fill);min-width:2px}
.bar.src{background:none}
.bar .s1{background:var(--series-1)}.bar .s2{background:var(--series-2)}
.bar.warn>i{background:var(--st-need)}.bar.err>i{background:var(--st-err)}.bar.ok>i{background:var(--st-done)}.bar.gold>i{background:var(--gold)}
.bar .sx,.sw.sx{background:repeating-linear-gradient(135deg,var(--bcm) 0 2px,transparent 2px 4px)}
.bar .sx{flex:none;width:10px;border-radius:0}
.bar.off{visibility:hidden}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-0.5px}
.sw.s1{background:var(--series-1)}.sw.s2{background:var(--series-2)}
.ring{width:16px;height:16px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.5}
.ring .trk{stroke:var(--line-strong)}.ring .arc{stroke:var(--meter-fill);stroke-linecap:round}
.ring.warn .arc{stroke:var(--st-need)}.ring.err .arc{stroke:var(--st-err)}
.cue{color:var(--st-need);display:inline-flex}.cue.err{color:var(--st-err)}
.cue svg.ic{width:11px;height:11px}

/* Header */
.hd{display:flex;gap:var(--sp2);align-items:flex-start;padding:var(--sp3) var(--sp2) var(--sp3) var(--sp3)}
.hd h2{margin:0 0 6px;font-weight:600;font-size:.875rem;line-height:1.25rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding-bottom:1px}
.hd .chips{display:flex;gap:var(--sp1);min-width:0}
@container (max-width:340px){.hd .chips{flex-wrap:wrap}}
.hd .chips .chip{flex:none}.hd .chips .chip.mono{flex:0 1 auto}
.acts{display:flex;gap:2px;flex:none}
.ib{width:24px;height:24px;display:grid;place-items:center;border-radius:var(--r-btn);color:var(--bcm)}
.ib:hover{background:var(--hover);color:var(--bc)}
.ib.danger{color:var(--st-err)}

/* Request line */
.req{display:flex;align-items:center;gap:var(--sp2);padding:6px var(--sp3);border-top:1px solid var(--line);background:color-mix(in oklch,var(--st-need) 9%,transparent)}
.req svg{color:var(--st-need)}
.req span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-xs{height:20px;padding:0 8px;border-radius:var(--r-btn);border:1px solid var(--line-strong);font-size:var(--t-cap);font-weight:500;flex:none}
.btn-xs:hover{background:var(--hover)}

/* SESSION tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{padding:var(--sp2) 10px;border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.tile:nth-child(3n+1){border-left:0;padding-left:0}
.tile:nth-child(3n){padding-right:0}
.tile:nth-child(n+4){border-top:1px solid var(--line)}
.tile:nth-child(-n+3){padding-top:0}
.tile .cap{font-size:var(--t-cap);color:var(--bcm);display:flex;align-items:center;gap:3px}
.tile .val{font-weight:600;font-size:var(--t-val);line-height:1.5rem;letter-spacing:-.01em}
.tile .val .mk{font-size:.8125rem}
.tiles.n5 .tile:nth-child(5){grid-column:span 2;padding-right:0}
.tile:focus-visible{outline-offset:-2px}
.tile .sub{height:1rem;display:flex;align-items:center;font-size:var(--t-cap);color:var(--bcm);white-space:nowrap;gap:5px}
.tile .sub .bar{flex:1}
button.tile{border-radius:0}
button.tile:hover .cap,button.tile[aria-expanded="true"] .cap{color:var(--bc)}
button.tile .cap svg{width:10px;height:10px;transition:transform .15s}
button.tile[aria-expanded="true"] .cap svg{transform:rotate(180deg)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--st-run);flex:none}
.legend{display:flex;gap:var(--sp4);margin-top:var(--sp2);font-size:var(--t-cap);color:var(--bcm)}
.legend b{font-weight:500;color:var(--bc);font-variant-numeric:tabular-nums;margin-left:4px}
@container (max-width:340px){.tile{padding-left:6px;padding-right:6px}.tile .val{font-size:1rem}.tile .sub{font-size:.625rem;gap:3px}}
.tiles.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(4px)}}

/* Popover (Models) */
.pop{margin-top:var(--sp2);background:var(--surface-3);border:1px solid var(--line-strong);border-radius:var(--r-box);box-shadow:var(--shadow-raised);padding:10px var(--sp3)}
.pop table{width:100%;border-collapse:collapse}
.pop td{padding:3px 0;font-size:var(--t-num)}
.pop td.r{text-align:right;width:60px;vertical-align:top}
.pop td small{display:block;font-size:.625rem;line-height:.8125rem;color:var(--bcm);font-variant-numeric:tabular-nums}
.pop tr.sum td{border-top:1px solid var(--line);padding-top:5px;font-weight:600}
.pop .strip{border-top:1px solid var(--line);margin-top:5px;padding-top:6px}

/* AGENTS table */
table.ag{width:calc(100% + 1.5rem);margin:0 -.75rem;border-collapse:collapse;table-layout:fixed}
.ag col.c-tok{width:56px}.ag col.c-cost{width:62px}.ag col.c-time{width:58px}
@container (max-width:340px){.ag col.c-tok{width:52px}.ag col.c-cost{width:54px}.ag col.c-time{width:50px}.ag td,.ag th{padding-left:6px}.agent{gap:6px}.agent .nm .rl,.agent .nm .cch{display:none}}
.ag th{font-size:var(--t-cap);font-weight:400;color:var(--bcm);text-align:right;padding:0 0 4px 8px}
.ag th:first-child{text-align:left;padding-left:var(--sp3)}
.ag th:last-child,.ag td:last-child{padding-right:var(--sp3)}
.ag td{padding:6px 0 6px 8px;text-align:right;vertical-align:middle;font-size:var(--t-num)}
.ag td:first-child{padding-left:var(--sp3);text-align:left}
.ag tr.row{cursor:pointer}
.ag tr.row:hover td{background:var(--hover)}
.ag tr.sel td,.ag tr.sel+tr.exp td{background:var(--highlight)}
.ag tr.sel td:first-child,.ag tr.sel+tr.exp td:first-child{box-shadow:inset 2px 0 0 var(--gold)}
.agent{display:flex;align-items:center;gap:var(--sp2);width:100%;min-width:0}
.av{position:relative;width:26px;height:26px;border-radius:50%;background:var(--surface-3);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--bc)}
.av svg.ic{width:13px;height:13px}
.bd{position:absolute;right:-4px;bottom:-4px;width:13px;height:13px;border-radius:50%;background:var(--tone);color:var(--b1);display:grid;place-items:center;box-shadow:0 0 0 2px var(--b1)}
.bd svg.ic{width:8px;height:8px;stroke-width:3.5}
.bd.t-run svg{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.nm{min-width:0;display:flex;flex-direction:column}
.nm b{font-weight:600;font-size:var(--t-row);line-height:1.0625rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{font-size:var(--t-cap);line-height:.875rem;color:var(--bcm);display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.nm small{overflow:hidden}
.nm .mdl{overflow:hidden;text-overflow:ellipsis;min-width:1.5rem}
.nm .rl{overflow:hidden;text-overflow:ellipsis;flex:0 100 auto}.nm .rl::before{content:'· '}
.nm .x{display:inline-flex;align-items:center;gap:3px;flex:none}
.nm .x svg.ic{width:10px;height:10px}.ring.sm{width:11px;height:11px}
.cch.c-low{color:var(--st-need)}.cch.c-expired .num,.cch.c-idle .num,.cch.c-unknown .num{opacity:.7}
.agent{text-align:left}
.tokc{display:flex;flex-direction:column;align-items:flex-end;gap:3px}.tokc .bar{width:100%}
.tokc .bar{height:2px;background:var(--line)}.tokc .bar>i{flex:none;min-width:0}
.rq{margin-bottom:6px}.rq .line+.line,.rq .out+.line{margin-top:5px;gap:6px}
.out{margin:5px 0 0;padding:4px 6px;background:var(--b1);border:1px solid var(--line);border-radius:var(--r-chip);font:.625rem/.875rem var(--mono);max-height:3.75rem;overflow:auto;white-space:pre}
.none{margin:6px 0 0;white-space:normal}
.ag tr.exp td{padding:0 var(--sp3) var(--sp2) calc(var(--sp3) + 34px);text-align:left}
.strip{display:flex;gap:var(--sp3);flex-wrap:wrap;font-size:var(--t-cap);color:var(--bcm);margin:0}
.strip div{display:flex;gap:4px}.strip dt{margin:0}.strip dd{margin:0;color:var(--bc);font-variant-numeric:tabular-nums}
.steer{display:flex;gap:4px;margin-top:6px;position:relative}
.steer input{flex:1;min-width:0;height:26px;padding:0 8px;background:var(--b1);border:1px solid var(--line-strong);border-radius:var(--r-btn);font-size:var(--t-num)}
.steer input::placeholder{color:var(--bcm)}
.steer .ib{width:26px;height:26px;border:1px solid var(--line)}
.alert{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:var(--t-cap);color:var(--bc)}
.alert svg{color:var(--st-err)}
.menu{position:absolute;right:0;top:30px;z-index:6;min-width:132px;background:var(--surface-3);border:1px solid var(--line-strong);border-radius:var(--r-box);box-shadow:var(--shadow-raised);padding:4px;display:flex;flex-direction:column}
.menu button{padding:5px 8px;border-radius:calc(var(--r-box) - 4px);font-size:var(--t-num)}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu button.danger{color:var(--st-err)}
.more{display:flex;align-items:center;gap:4px;margin-top:4px;padding:3px 6px 3px 0;color:var(--bcm);font-size:var(--t-cap);border-radius:var(--r-btn)}
.more:hover{color:var(--bc)}
.more svg{width:11px;height:11px}

/* Generic rows shared by LIMITS / TASK / GIT / LINKED */
.rows>*+*{margin-top:10px}
.line{display:flex;align-items:center;gap:var(--sp2);min-width:0}

.grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl{font-weight:600;font-size:var(--t-row);line-height:1.125rem}
.lim .win{display:grid;grid-template-columns:30px minmax(0,1fr) 46px 60px;align-items:center;column-gap:var(--sp2);height:18px;font-size:var(--t-cap)}
.lim .bar>i{min-width:0}.lim .wl{color:var(--bcm)}.lim .rs{text-align:right}.lim .gl{font-size:var(--t-cap);color:var(--bcm);margin-top:5px;line-height:1rem}
.lim .line{margin-bottom:2px}.lim .off{font-style:italic}
.lim .pct{display:inline-flex;align-items:center;justify-content:flex-end;gap:3px}
.lim .pct{font-weight:600;font-size:var(--t-num)}
.notice{display:flex;align-items:center;gap:6px;font-size:var(--t-cap);color:var(--bcm);margin-bottom:var(--sp2)}
.notice svg{color:var(--st-need);width:12px;height:12px}
.docs{display:flex;flex-wrap:wrap;gap:4px;margin-top:var(--sp2)}
.prog{display:flex;align-items:center;gap:var(--sp2);margin-top:6px}.prog .bar{flex:1}
/* TASK digest (rev 3 task update): stats line, verdict cue, "+N more" menu anchor, folder count lines */
.sec-h .hx{display:flex;align-items:center;gap:var(--sp1);min-width:0}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:10px}
.tiles.t4 .tile{padding:0 8px;border-left:1px solid var(--line);border-top:0}.tiles.t4 .tile:first-child{border-left:0;padding-left:0}.tiles.t4 .tile:last-child{padding-right:0}
.tiles.t4 .cap{white-space:nowrap;overflow:hidden}.tiles.t4 .cap svg{width:10px;height:10px;flex:none;color:var(--tone)}
.tile.t-need .val,.tile.t-run .val{color:var(--tone)}
@container (max-width:380px){.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.t4 .tile:nth-child(odd){border-left:0;padding-left:0}.tiles.t4 .tile:nth-child(even){padding-right:0}.tiles.t4 .tile:nth-child(-n+2){padding-bottom:6px}.tiles.t4 .tile:nth-child(n+3){border-top:1px solid var(--line);padding-top:6px}}
.tmeta{margin-top:6px;line-height:1rem}.tmeta b{color:var(--bc);font-weight:600}.tnote{margin:var(--sp2) 0 0}
.tiles.t2{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:var(--sp2);padding-top:var(--sp2);border-top:1px solid var(--line)}
.tiles.t2 .tile{padding-bottom:0}.tiles.t2 .tile:nth-child(2){padding-right:0}.tiles.t2 .tile:only-child{grid-column:span 2}.tiles.t2 .tile:disabled{cursor:default}
.sec>.pop .docs,.sec>.pop .tdirs{margin-top:0}
.vd{display:inline-flex;align-items:center;gap:3px;flex:none;color:var(--bc)}.vd svg{width:11px;height:11px;color:var(--tone)}.vd.t-done,.vd.t-need{color:var(--tone);font-weight:600}
.chip:disabled{opacity:.6;cursor:default}
.mw{position:relative;display:inline-flex}.mw .menu{top:22px;left:0;right:auto;max-width:240px}.mw .menu button{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tdirs{list-style:none;margin:var(--sp2) 0 0;padding:0}.tdirs li{height:18px;font-size:var(--t-cap)}.tdirs svg{width:12px;height:12px;color:var(--bcm);flex:none}
.add{color:var(--st-done)}.del{color:var(--st-err)}
.mono{font-family:var(--mono);font-size:.6875rem}
.lk{display:flex;align-items:center;gap:var(--sp2);width:calc(100% + 1.5rem);margin:0 -.75rem;padding:5px var(--sp3)}
.lk:hover{background:var(--hover)}
.lk[aria-current="true"]{background:var(--highlight);box-shadow:inset 2px 0 0 var(--gold)}
.lk[aria-current="true"] .grow{font-weight:600}
.sk{display:block;height:10px;border-radius:4px;background:var(--line-strong);animation:pulse 1.4s ease-in-out infinite}

/* Tooltip */
#tip{position:fixed;z-index:20;max-width:260px;padding:5px 8px;background:var(--bc);color:var(--b1);border-radius:6px;font-size:var(--t-cap);line-height:.9375rem;pointer-events:none;opacity:0;transition:opacity .1s;font-variant-numeric:tabular-nums}
#tip.on{opacity:1}

/* Rail (56 px) */
.rail{width:56px;background:var(--b1);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:var(--sp1);padding:var(--sp1) 0;min-height:100%}
.rail .rb{width:48px;min-height:40px;border-radius:var(--r-btn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0}
.rail .rb:hover{background:var(--hover)}
.rail .rb .cap{font-size:.625rem;color:var(--bcm)}
.rail .rb .num{font-size:.6875rem;font-weight:600}
.rail .rb .num .mk{font-size:.625rem}
.rail .rb{position:relative}.rail .rb .av{margin:2px 0}
.att{position:absolute;top:2px;right:2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--st-need);color:var(--b1);font-size:.625rem;font-weight:700;line-height:14px;text-align:center}
.rail hr{width:32px;border:0;border-top:1px solid var(--line);margin:2px 0}
.rail .av{margin:3px 0}
.rail .ring{width:20px;height:20px}

  :`<span class="bar" data-component="ptah-meter" role="img" aria-label="Task progress not available"></span><span class="meta">${U} tasks</span>`;
 const sk='<span class="sk" style="width:28px;height:14px;margin:5px 0"></span>';
 const tile=(cap,v,o={})=>{const on=v>0&&o.tone;return `<div class="tile ${on?o.tone:''}" data-component="ptah-stat" role="group" aria-label="${o.name||cap}: ${busy?'loading':v==null?'not available':v}"${o.tip?` data-tip="${o.tip}"`:''}><span class="cap" aria-hidden="true">${on&&o.icon?ic(o.icon):''}${cap}</span><span class="val" aria-hidden="true">${busy?sk:v==null?'<span class="num unk">—</span>':`<span class="num${v===0&&o.tone?' unk':''}">${v}</span>`}</span></div>`};
 const dc=d&&d.decisions;
 const stats=tile('Decisions',dc?dc.rows:null,{tip:'Rows in decisions.md'})+tile('Pending you',dc?dc.pendingUser:null,{tone:'t-need',icon:'bang',tip:'Decisions waiting for you'})
  +tile('Questions',d?d.openQuestions??null:null,{tone:'t-run',name:'Open questions',tip:'Open questions'})+tile('Entries',d?d.entryCount:null,{tip:'Top-level files and folders in the task folder'});
 const meta=busy?'<div class="meta tmeta"><span class="sk" style="width:96px;margin:3px 0"></span></div>':`<div class="meta tmeta"><span data-tip="Last change ${d&&d.lastModifiedAbs||'not available'}">changed ${d&&d.lastModified?`<b class="num">${d.lastModified}</b>`:U}</span>${d&&d.truncated?` <span data-tip="Counts are lower bounds (limit reached: ${d.truncatedReasons.join(', ')})">· partial</span>`:''}</div>`;
 const chip=x=>{const n=x.name,rv=x.kind==='reviews';
  if(x.readable===false)return `<button class="chip" disabled aria-label="${n}, unreadable">${ic('file')}<span>${n}</span><span class="vd">unreadable</span></button>`;
  let cue='',name=`Open ${n}`;
  if(rv){const r=d&&(d.reviews||[]).find(r=>r.file===n),v=r&&VD[r.verdict],c=r&&r.serious!=null;
   cue=v?`<span class="vd ${v[0]}">${ic(v[1])}${v[2]}</span>`:`<span class="vd muted">—</span>`;
   if(c)cue+=`<span class="vd mono muted" aria-hidden="true">${r.serious}·${r.moderate}·${r.minor}</span>`;
   name+=v?`, review verdict ${v[2]}`:', review verdict not available';if(c)name+=`, ${r.serious} serious, ${r.moderate} moderate, ${r.minor} minor findings`}
  return `<button class="chip" aria-pressed="${S.docs===n}" aria-label="${name}" data-doc="${n}" data-tip="${name}">${ic('file')}<span>${n}</span>${cue}</button>`};
 const more=t.more.length?`<span class="mw"><button class="chip" id="t-more" aria-haspopup="menu" aria-expanded="${!!S.tm}" aria-controls="t-more-menu" aria-label="${t.more.length} more task documents"><span>+${t.more.length} more</span></button>${S.tm?`<div class="menu" id="t-more-menu" role="menu" aria-label="More task documents">${t.more.map(n=>`<button role="menuitem" data-doc="${n}" aria-label="Open ${n}">${n}</button>`).join('')}</div>`:''}</span>`:'';
 const dir=x=>`<li class="line">${ic('folder')}<span class="mono grow" data-tip="${x.name}/">${x.name}/</span>${x.files==null?'<span class="meta">not counted</span>':`<span class="meta">${[x.markdown&&`${x.markdown} md`,x.images&&`${x.images} img`].filter(Boolean).join(' · ')}</span><span class="meta"><b class="num">${x.truncated?'≥':''}${x.files}</b> files</span>`}</li>`;
 const nd=t.chips.length+t.more.length,rvs=d&&d.reviews||[],nrev=rvs.filter(r=>r.verdict==='REVISE').length,napp=rvs.filter(r=>r.verdict==='APPROVED').length;
 const dsub=busy?'<span class="sk" style="width:60px"></span>':!d?`reviews ${U}`:rvs.length?`${rvs.length} review${rvs.length>1?'s':''}${nrev?` · <span class="vd t-need">${ic('bang')}${nrev} revise</span>`:napp===rvs.length?` · <span class="vd t-done">${ic('check')}approved</span>`:''}`:'no reviews';
 const dtile=`<button class="tile" id="t-docs" data-component="ptah-stat + ptah-disclosure" aria-expanded="${!!S.td}" aria-controls="task-docs" aria-label="${nd} documents${d&&rvs.length?`, ${rvs.length} reviews, ${nrev} revise`:''}. ${S.td?'Hide':'Show'} documents"><span class="cap">Documents ${ic('down')}</span><span class="val"><span class="num">${nd}</span></span><span class="sub">${dsub}</span></button>`;
 const dirs=d&&d.directories||[],nf=dirs.reduce((a,x)=>a+(x.files||0),0),ge=dirs.some(x=>x.truncated||x.files==null)?'≥':'';
 const ftile=dirs.length?`<button class="tile" id="t-dirs" data-component="ptah-stat + ptah-disclosure" aria-expanded="${!!S.tf}" aria-controls="task-dirs" aria-label="${dirs.length} folders, ${ge?'at least ':''}${nf} files. ${S.tf?'Hide':'Show'} folders"><span class="cap">Folders ${ic('down')}</span><span class="val"><span class="num">${dirs.length}</span></span><span class="sub"><span><b class="num">${ge}${nf}</b> files</span></span></button>`
  :busy||fail?`<button class="tile" id="t-dirs" disabled aria-label="Folders ${busy?'loading':'not available'}"><span class="cap">Folders</span><span class="val">${busy?sk:'<span class="num unk">—</span>'}</span><span class="sub">${busy?'<span class="sk" style="width:44px"></span>':`files ${U}`}</span></button>`:'';
 return `<section class="sec" data-component="ptah-surface-section" aria-labelledby="h-t" ${busy?'aria-busy="true"':''}><div class="sec-h"><h3 id="h-t">Task</h3><span class="hx"><span class="chip st ${tc}" data-component="ptah-badge">${ic(ti)}<span>${t.label}</span></span><span class="chip mono" data-component="ptah-badge" data-tip="${t.id}"><span>${t.id}</span></span></span></div>
 <div class="line"><span class="ttl grow" data-tip="${esc(t.title)}">${esc(t.title)}</span></div>
 <div class="prog"><span class="meta">${t.stage}</span>${prog}</div>
 <div class="tiles t4" role="group" aria-label="Task statistics${busy?', loading':fail?', not available':''}">${stats}</div>
 ${meta}
 ${fail?`<div class="notice tnote" role="status">${ic('alert')}<span class="grow">Task statistics unavailable</span><button class="btn-xs" data-act="tretry" aria-label="Retry loading task statistics">Retry</button></div>`:''}
 <div class="tiles t2">${dtile}${ftile}</div>
 ${S.td?`<div class="pop" id="task-docs" role="region" aria-label="Task documents" data-component="ptah-disclosure"><div class="docs">${t.chips.map(chip).join('')}${more}${t.related?`<button class="chip" aria-expanded="false" aria-label="${t.related} related tasks"><span>+${t.related} related</span></button>`:''}</div></div>`:''}
 ${S.tf&&dirs.length?`<div class="pop" id="task-dirs" role="region" aria-label="Task folders, file counts only" data-component="ptah-disclosure"><ul class="tdirs">${dirs.map(dir).join('')}</ul></div>`:''}</section>`}
/* TASK disclosures: ?open=docs,dirs pre-expands the Documents / Folders tiles (screenshots) */
{const o=(P.get('open')||'').split(',');S.td=o.includes('docs');S.tf=o.includes('dirs')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.tm){S.tm=false;render();document.getElementById('t-more')?.focus()}});
function git(){if(F.loading)return '';const g=F.git;
 return `<section class="sec" data-component="ptah-surface-section" aria-labelledby="h-g"><div class="sec-h"><h3 id="h-g">Git</h3>${g?'<button class="link">Review changes</button>':''}</div>
 ${g?`<div class="line"><span class="muted" style="display:flex">${ic('branch')}</span><span class="mono grow" data-tip="${g.branch}">${g.branch}</span>${g.detached?'<span class="chip" data-component="span[ptahBadge]"><span>detached</span></span>':''}<span class="num" data-tip="Uncommitted changes"><span class="add">+${g.add}</span> <span class="del">−${g.del}</span></span></div>`
   :`<div class="line muted">${ic('branch')}<span>Not a git repository</span></div>`}</section>`}
function linked(){if(F.loading||!F.linked.length)return '';
 return `<section class="sec" data-component="ptah-surface-section" aria-labelledby="h-k"><div class="sec-h"><h3 id="h-k">Linked sessions</h3><span class="meta">${F.linked.length}</span></div>
 <div role="list">${F.linked.map(l=>`<div role="listitem"><button class="lk" aria-current="${!!l.cur}"><span class="grow">${esc(l.t)}</span><span class="meta">${l.rel}</span></button></div>`).join('')}</div></section>`}


function render(){document.documentElement.dataset.theme=S.theme==='light'?'anubis-light':'anubis';
 const root=document.getElementById('root');
 if(S.w==='rail'){root.innerHTML=rail();root.style.width='56px';return}
 root.style.width=S.w+'px';
 root.innerHTML=`<aside class="insp" aria-label="This session" data-inspector-pane>${header()}${session()}${agents()}${limits()}${task()}${git()}${linked()}</aside>`;
 S.enter=false;if(S.focus){const h=root.querySelector(`[data-inspector-section="${S.focus}"] h3`);if(h){h.focus();say(h.textContent+' section')}S.focus=null}}
function say(t){const l=document.getElementById('live');if(l)l.textContent=t}
function sync(){const q=new URLSearchParams({w:S.w,theme:S.theme,fx:S.fx});if(document.body.classList.contains('bare'))q.set('chrome','0');history.replaceState(null,'','?'+q)}

/* ---------- interactions ---------- */
document.addEventListener('click',e=>{const t=e.target;
 const an=t.closest('[data-ans]');if(an){const a=F.agents.find(a=>a.id===S.sel);if(a){F.requests=F.requests.filter(r=>r.row!==a.id);a.req=null;a.st='running';render();say(an.dataset.ans+' sent to '+a.n);document.querySelector(`button[data-row="${a.id}"]`)?.focus()}return}
 const go=t.closest('[data-goto]');if(go){S.sel=go.dataset.goto;S.more=true;render();document.querySelector('.rq [data-ans]')?.focus();return}
 const act=t.closest('[data-act]');
 if(act){const a=act.dataset.act;if(a==='rail'){S.back=S.w;S.w='rail'}else if(a==='expand'){S.w=S.back||'400';S.focus=act.dataset.target||null}else if(a==='send'){S.err=!document.getElementById('steer-in').value.trim();if(!S.err)say('Steer sent')}else if(a==='retry'){S.err=false}
  document.getElementById('c-w').value=S.w;sync();render();return}
 if(t.closest('.menu [data-m]')){const m=t.closest('[data-m]').dataset.m;S.menu=false;render();if(m==='steer')document.getElementById('steer-in')?.focus();else{say(m==='stop'?'Stop requested':'Moved to background');document.getElementById('menu-btn')?.focus()}return}
 if(t.closest('#menu-btn')){S.menu=!S.menu;render();(S.menu?document.querySelector('.menu button'):document.getElementById('menu-btn'))?.focus();return}
 if(t.closest('#t-models')){S.pop=!S.pop;render();document.getElementById('t-models').focus();return}
 if(t.closest('#more')){S.more=!S.more;render();document.getElementById('more').focus();return}
 for(const [id,k] of [['t-docs','td'],['t-dirs','tf']])if(t.closest('#'+id)){S[k]=!S[k];S.tm=false;render();document.getElementById(id)?.focus();return}
 if(t.closest('#t-more')){S.tm=!S.tm;render();document.getElementById('t-more')?.focus();return}
 if(t.closest('[data-act="tretry"]')){F.task.ds='loading';render();say('Loading task statistics');return}
 if(t.closest('[data-doc]')){S.tm=false;const d=t.closest('[data-doc]').dataset.doc;S.docs=S.docs===d?null:d;render();return}
 if(t.closest('.exp')||t.closest('.pop'))return;
 const row=t.closest('tr.row');
 if(row){S.sel=S.sel===row.dataset.row?null:row.dataset.row;S.menu=false;S.err=false;render();document.querySelector(`button[data-row="${row.dataset.row}"]`)?.focus();return}
 if(S.pop||S.menu){S.pop=S.menu=false;render()}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
 if(S.menu){S.menu=false;render();document.getElementById('menu-btn')?.focus()}
 else if(S.pop){S.pop=false;render();document.getElementById('t-models')?.focus()}});
const tip=document.getElementById('tip');
function showTip(el){tip.textContent=el.dataset.tip;tip.classList.add('on');const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
 tip.style.left=Math.max(4,Math.min(innerWidth-w-4,r.left+r.width/2-w/2))+'px';tip.style.top=(r.top-h-6<4?r.bottom+6:r.top-h-6)+'px'}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');el?showTip(el):tip.classList.remove('on')});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]')||e.target.querySelector?.('[data-tip]');el?showTip(el):tip.classList.remove('on')});
setInterval(()=>document.querySelectorAll('[data-live]').forEach(el=>{const s=Math.max(0,+el.dataset.s+ +el.dataset.live);el.dataset.s=s;el.textContent=(el.dataset.short?dur:clock)(s);
 const id=el.closest('tr')?.dataset.row,a=F.agents.find(a=>a.id===id);if(el.dataset.cache&&F.cache)F.cache.s=s;else if(a&&a.k!=='orch')a.d=s;else if(F.s)F.s.time=s}),1000);
for(const k of ['w','theme','fx']){const el=document.getElementById('c-'+k);el.value=S[k];el.addEventListener('change',()=>{S[k]=el.value;if(k==='fx'){F=FX[S.fx]();S.sel=null;S.more=S.pop=S.menu=S.err=false;S.enter=true}sync();render();if(k==='fx')say('Session: '+F.header.title)})}
render();
</script>
</body>
