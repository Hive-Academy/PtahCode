}
:root[data-theme="ptah-glass-light"]{

<script>
/* ============================ state ============================ */
/* S.setup is the ONE stored Setup pair: null (unset) or {prov, model}. Screen-state buttons never overwrite it;
   the seed buttons in the chrome write fixtures into it, the Setup picker writes it atomically (provider+model together). */
const S = { xp:new Set(), theme:'ptah-glass', w:'full', surface:'skills', state:'judged', gen:'ok', create:'ok', inst:'ok', sout:'results', railMode:'rail',

function rail(m){

function alertHtml(a){return `<div class="alert ${a.tone}" role="${a.tone==='err'?'alert':'status'}"><span class="ic" aria-hidden="true">!</span><div class="body"><strong>${esc(a.title)}</strong> ${esc(a.text)}<div class="acts">${(a.acts||[]).map(x=>x==='rerun'?'<button class="btn xs" data-act="rerun">Re-run</button>':'<button class="btn xs ghost" data-act="gotoSettings">Open Settings</button>').join('')}</div></div></div>`}

/* ============================ per-item and global search ============================ */
function searchResults(i,q){
  const base=i?slugItem(i):slugOf(q)||'skill';
  return [{s:'skills-hub',n:`${base}-conventions`,d:`Conventions and pitfalls for ${i?i.name:q}.`,i:'5.2K'},{s:'community-registry',n:`${base}-quickstart`,d:`Quickstart notes for ${i?i.name:q}.`,i:'1.4K',http:true}]
   .map(c=>{c.key=`${c.s}/${c.n}`;c.url=`${c.http?'http':'https'}://skills.example/${c.s}/${c.n}`;SEARCHED[c.key]=c;return c});
}
function searchPanel(i){
  const s=S.isearch, name=i?i.name:'the registry';
  const kept=Object.keys(S.manual).filter(k=>S.sel.has(k));
  let res='';
  if(s.phase==='idle')res=`<p class="hint">Type a query and press Search. Nothing has been searched yet.</p>`;
  if(s.phase==='loading')res=`<div class="row" role="status"><span class="spin" aria-hidden="true"></span><span>Searching the registry for “${esc(s.q)}”…</span></div>`;
  if(s.phase==='results'){const rs=searchResults(i,s.q);res=`<p class="hint">${rs.length} results for “${esc(s.q)}”</p><div class="grid">${rs.map(c=>pickCard(c.key,{reasons:[['Search result','Not judged: returned by your search.']]})).join('')}</div>`}
  if(s.phase==='none')res=`<p class="hint" role="status">No other results for “${esc(s.q)}”. Your earlier selections are kept.</p>`;
  if(s.phase==='error')res=`<div class="alert err" role="alert"><span class="ic" aria-hidden="true">!</span><div class="body">Search failed for “${esc(s.q)}” (network timeout). Nothing was changed.<div class="acts"><button class="btn xs" data-act="isubmit">Retry search</button></div></div></div>`;
  return `<div class="editor" role="region" aria-label="Search results for ${esc(name)}" data-testid="item-search">
   <div class="row" style="align-items:flex-end"><div style="flex:1;min-width:12rem"><label class="f" for="isq">Search ${i?'for '+esc(i.name):'skills'}</label><input class="input" id="isq" data-isq value="${esc(s.q)}" placeholder="Search the registry by name"/></div>
    <button class="btn sm" data-act="isubmit">Search</button><button class="btn sm outline" data-act="iclear">Clear</button><button class="btn sm ghost" data-act="iclose">Close</button></div>
   <div aria-live="polite">${res}</div>
   ${kept.length?`<p class="hint">Selections kept from searches: ${kept.map(k=>esc(candOf(k).n)).join(', ')}.</p>`:''}</div>`;
}

/* ============================ draft editor ============================ */
const genContent=(items,why)=>{const nm=items.map(x=>x.name);return `---\nname: ${nameFromItem(items[0].name)}\ndescription: Project conventions for ${nm.join(' and ')}.\n---\n\n# ${items[0].name}\n\n## When to use\nUse when changing ${nm.join(' or ')} in this repository.\n- Editing files that import or configure it\n- Reviewing a pull request that touches it\n\n## Project evidence\n${items.map(x=>`- ${x.name}: ${x.ev}`).join('\n')}\n\n## Conventions\n- Follow the pattern already used in the repository; do not add a second one.\n- Why this skill was proposed: ${why||'n/a'}\n- Keep each change small and covered by the existing tests.\n\n## Before you finish\n- Run lint and tests of the affected project only.\n- Mention any deviation from the evidence above in the pull request.\n`};
const defaultContent=items=>`# ${items[0].name}\n\n## Verified project evidence\n\n${items.map(x=>x.ev).join('\n')}\n\n## Guidance\n\nDescribe how to work with ${items[0].name} in this project.`;
function editor(){
  const d=S.draft;
  if(d.status==='generating')return `<div class="editor" data-testid="draft-editor"><div class="row" role="status"><span class="spin" aria-hidden="true"></span><span>Generating content from project evidence…</span></div></div>`;
  const slug=slugOf(d.name), bodyOk=(d.content||'').trim().length>0, busy=d.status==='creating';
  const dis=busy||!slug||!bodyOk;
  const manual=d.status==='manual'||d.manual;
  const rd=d.mode!=='edit'&&!manual&&bodyOk;
  return `<div class="editor" data-testid="draft-editor">
   <div class="row"><h3>Skill draft</h3><span class="badge ${manual?'warn':'info'}">${manual?'Written by hand':'Generated, review before creating'}</span></div>
   ${manual&&d.why?`<div class="alert warn" role="status"><span class="ic" aria-hidden="true">!</span><div class="body">${esc(d.why)} The draft has the item name and its evidence so you can write it by hand.${d.why.startsWith('No model')?'':`<div class="acts"><button class="btn xs" data-act="regen">Try generating again</button></div>`}</div></div>`:''}
   ${d.status==='created'?`<div class="alert info" role="status"><span class="ic" aria-hidden="true">✓</span><div class="body">Created: <span class="mono">${esc(d.path)}</span></div></div>`:''}
   ${d.status==='createfail'?`<div class="alert err" role="alert"><span class="ic" aria-hidden="true">!</span><div class="body">Could not create this skill. Your draft is still here.</div></div>`:''}
   ${S.confirm?`<div class="alert warn" role="alertdialog" aria-labelledby="cft" data-testid="confirm-replace"><span class="ic" aria-hidden="true">!</span><div class="body"><strong id="cft">Replace this draft?</strong> You edited it and the changes are not saved. Replacing it discards them.<div class="acts"><button class="btn xs" id="cfk" data-act="cfno">Keep editing</button><button class="btn xs ghost" data-act="cfok">Replace draft</button></div></div></div>`:''}
   <p class="hint" data-testid="no-write-note"><strong>Nothing is written until you press Create skill.</strong></p>
   ${rd?`<div class="stack-s" data-testid="draft-preview"><div class="row"><h4 id="pvh" tabindex="-1" style="margin:0">Preview: <span class="mono">${esc(d.name||'(no name)')}</span></h4><span class="sp"></span><button class="btn xs outline tgl" data-act="draftMode" ${busy?'disabled aria-disabled="true"':''}>Edit</button></div>
   <p class="hint">Description: ${esc(d.description)}</p>
   ${d.src?`<p class="hint">Why proposed: ${esc(d.src)}</p>`:''}
   <pre class="pv" tabindex="0" aria-label="Generated SKILL.md content">${esc(d.content).split('\n').map(l=>/^#/.test(l)?`<span class="h">${l}</span>`:/^(---|name:|description:)/.test(l)?`<span class="fm">${l}</span>`:l).join('\n')}</pre></div>`:''}
   <p class="hint">Destination: <span class="mono" id="dest">${slug?esc(pathOf(slug)):'Enter a name that contains letters or digits.'}</span></p>
   ${rd?'':`${manual?'':`<div class="row"><button class="btn xs outline tgl" data-act="draftMode" ${busy?'disabled aria-disabled="true"':''}>Back to preview</button></div>`}<div><label class="f" for="dn">Skill name</label><input class="input" id="dn" data-draft="name" value="${esc(d.name)}" ${busy?'readonly':''}/></div>
   <div><label class="f" for="dd">Description</label><input class="input" id="dd" data-draft="description" value="${esc(d.description)}" ${busy?'readonly':''}/></div>
   <div><label class="f" for="dc">Skill content</label><textarea id="dc" data-draft="content" ${busy?'readonly':''}>${esc(d.content)}</textarea></div>`}
   <div class="row"><button class="btn primary sm" data-act="createSkill" ${dis?'disabled aria-disabled="true"':''}>${busy?'Creating…':'Create skill'}</button><button class="btn ghost sm" data-act="closeDraft">${d.status==='created'?'Close':'Cancel'}</button><span class="hint" id="dh">${!slug?'Add a name with letters or digits to create.':!bodyOk?'Add content to create.':''}</span></div></div>`;
}
function openDraft(loc,items,defName,opener,whyIn){
  const tok=++TOKEN;
  S.draft={loc,items,token:tok,opener,name:defName,description:`Project guidance for ${items[0].name}`,content:defaultContent(items),status:'generating',manual:false,why:''};
  const why=whyIn!==undefined?whyIn:items.map(i=>i.o&&i.o[0]?i.o[0].why:'').find(Boolean);S.draft.src=whyIn;S.confirm=null;
  if(S.gen==='nomodel'){Object.assign(S.draft,{status:'manual',why:'No model is configured for generation.'});render();focusDn();return}
  render();
  setTimeout(()=>{
    if(!S.draft||S.draft.token!==tok)return;           /* editor closed or replaced: ignore the late result */
    if(S.gen==='fail'){Object.assign(S.draft,{status:'manual',why:'Content could not be generated (provider error).'})}
    else if(S.gen==='empty'){Object.assign(S.draft,{status:'manual',why:'The model returned no content.'})}
    else Object.assign(S.draft,{status:'ready',description:`Project conventions for ${items.map(x=>x.name).join(' and ')}.`,content:genContent(items,why)});
    render();focusDn();announce(S.draft.status==='manual'?'Generation did not produce content; manual draft opened':'Draft generated');
  },700);
}
const focusDn=()=>(document.getElementById('dn')||document.getElementById('pvh'))?.focus();
function replaceDraft(fn){if(S.draft&&S.draft.dirty&&S.draft.status!=='creating'&&S.draft.status!=='generating'){S.confirm={fn};render();document.getElementById('cfk')?.focus();return}fn()}
function closeDraft(){S.confirm=null;const o=S.draft&&S.draft.opener;TOKEN++;S.draft=null;render();if(o)document.querySelector(`[data-oid="${o}"]`)?.focus()}
function refreshDerived(){
  const d=S.draft;if(!d)return;const slug=slugOf(d.name),ok=(d.content||'').trim().length>0;
  const dest=document.getElementById('dest');if(dest)dest.textContent=slug?pathOf(slug):'Enter a name that contains letters or digits.';

/* ============================ shell ============================ */
function render(){
  document.documentElement.dataset.theme=S.theme;
  const app=document.getElementById('app');app.dataset.w=S.w;
  document.getElementById('stateBar').innerHTML='<legend>State</legend>'+STATES[S.surface].map(([k,l])=>`<button class="btn xs" data-set="state" data-v="${k}" aria-pressed="${S.state===k}">${l}</button>`).join('');
  document.getElementById('seedBar').innerHTML='<legend>Stored Setup pair (seed)</legend>'+SEEDS.map(([k,l])=>`<button class="btn xs" data-seed="${k}" aria-pressed="${S.seed===k}">${l}</button>`).join('');
  document.getElementById('extraBar').classList.toggle('hide',S.surface!=='skills');
  document.querySelectorAll('[data-set]').forEach(b=>{const k=b.dataset.set;if(k==='state')return;b.setAttribute('aria-pressed',String(S[k]===b.dataset.v))});
  app.innerHTML=S.surface==='settings'?renderSettings():S.surface==='analyze'?renderAnalyze():renderSkills();
  const af=app.querySelector('[data-autofocus]');if(af&&S.surface==='settings'&&!S._focused){af.focus({preventScroll:true});S._focused=true}
}
function setSurface(v){S.surface=v;S.state=STATES[v][v==='skills'?1:0][0];S._init=null;S.editSetup=false;S.pick=null;S.signStep=false;S.undo=null;S.notice=null;S._focused=false}
function seedPair(k){const f=SEEDS.find(x=>x[0]===k);S.seed=k;S.setup=f[2]?{...f[2]}:null;PROV.openrouter.signed=false;S.undo=null;S.pick=null;S.signStep=false;S.editSetup=false}
function commit(pair,msg){S.undo={prev:S.setup?{...S.setup}:null,msg};S.setup=pair;S.pick=null;S.signStep=false;S.editSetup=false}
function startInstall(){
  S.phase={k:'preview',allow:new Set()};render();
  setTimeout(()=>{ if(!S.phase)return;
    if(S.inst==='previewerr'&&!S.instUsed){S.instUsed=true;S.phase.k='previewerr'}
    else{S.phase.k='consent'}
    render()},600);
}
function finishInstall(){
  S.phase.k='installing';render();
  setTimeout(()=>{ if(!S.phase)return;
    if(S.inst==='partial'&&!S.partialUsed){S.partialUsed=true;S.phase.k='partial'}else{S.phase.k='done';S.phase.n=S.sel.size}
    render()},700);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-pick]');if(!t)return;
  if(t.tagName==='A'&&t.getAttribute('href')&&t.getAttribute('href')!=='#'){e.preventDefault();return}
  if(t.dataset.xp!==undefined){e.preventDefault();const k=t.dataset.xp;S.xp.has(k)?S.xp.delete(k):S.xp.add(k);render();document.querySelector(`[data-xp="${CSS.escape(k)}"]`)?.focus();return}
  if(t.dataset.seed){seedPair(t.dataset.seed);render();return}
  if(t.dataset.set){const k=t.dataset.set,v=t.dataset.v;
    if(k==='surface')setSurface(v);
    else if(k==='state'){S.state=v;S._init=null;S.notice=null;S.resetNotice=false;S._focused=false}
    else if(k==='w')S.w=v;else{S[k]=v;if(k==='inst'){S.instUsed=false;S.partialUsed=false}}
    render();return}
  if(t.dataset.filter){S.filter=t.dataset.filter==='all'||S.filter===t.dataset.filter?'all':t.dataset.filter;render();return}
  if(t.dataset.vf){S.vf=t.dataset.vf==='all'||S.vf===t.dataset.vf?null:t.dataset.vf;render();return}
  const a=t.dataset.act;
  if(a==='editSetup'){S.editSetup=!S.editSetup;S.pick=null;render();return}
  if(a==='closeSetup'){S.editSetup=false;S.pick=null;S.signStep=false;render();document.getElementById('setupCell')?.focus();return}
  if(a==='signin'){S.editSetup=true;S.signStep=true;S.pick={prov:S.setup.prov,model:''};render();return}
  if(a==='doSignin'){PROV[t.dataset.p].signed=true;S.signStep=false;render();announce('Signed in');document.getElementById('md')?.focus();return}
  if(a==='useWorkspace'){commit(null,'Setup now follows the workspace model.');render();return}
  if(a==='undo'){const prev=S.undo.prev;S.setup=prev;S.undo={done:true,msg:prev?`Restored the previous Setup pair: ${pairStr(prev)}.`:'Restored: no Setup model chosen (workspace model applies).'};S.seed='';render();return}
  if(a==='gotoSettings'){e.preventDefault();S.surface='settings';S.state='deeplink';S._focused=false;S.editSetup=!!(t.dataset.sign||t.dataset.edit);S.signStep=!!t.dataset.sign;if(t.dataset.sign)S.pick={prov:S.setup.prov,model:''};render();return}
  if(a==='gotoAnalyze'){S.surface='analyze';S.state='idle';S.editSetup=false;render();return}
  if(a==='start'){S.runPair=effective();S.notice={text:`Start pressed (prototype stub). The run takes a snapshot of ${pairStr(effective())} now.`};render();return}
  if(a==='retryA2'){S.state='idle';S.notice={text:'Retried: the analysis and workspace provider loaded.'};render();return}
  if(a==='back'){S.notice={text:'Back pressed (prototype stub): the wizard returns to the Analyze page. Your selection is kept.'};render();return}
  if(a==='skip'){S.notice={text:'Skipped skills (prototype stub): continuing to Project guidance without installing.'};render();announce('Skipped skills');return}
  if(a==='dismiss'){S.notice=null;render();return}
  if(a==='dismissReset'){S.resetNotice=false;render();return}
  if(a==='tryagain'){S.state='loading';render();setTimeout(()=>{S.state='judged';S._init=null;render()},900);return}
  if(a==='rerun'){if(!takeSnapshot()){S.resetNotice=false;render();return}S.rerunning=true;S.isearch=null;render();setTimeout(()=>{S.rerunning=false;const m=model();selectedInit(m);S.resetNotice=true;render()},1000);return}
  if(a==='showMore'){S.expandChips=true;render();const m=model();document.querySelector(`[data-filter="item:${m.items[12].id}"]`)?.focus();return}
  if(a==='showLess'){S.expandChips=false;render();return}
  if(a==='remove'){S.sel.delete(t.dataset.key);render();announce('Removed from selection');return}
  if(a==='install'){startInstall();return}
  if(a==='pretry'){S.phase.k='preview';render();setTimeout(()=>{if(S.phase){S.phase.k='consent';render()}},500);return}
  if(a==='pcancel'){S.phase=null;render();return}
  if(a==='pinstall'){if(![...S.sel].filter(k=>(candOf(k).scripts||[]).length).every(k=>S.phase.allow.has(k)))return;finishInstall();return}
  if(a==='pretryfail'){S.phase.k='installing';render();setTimeout(()=>{if(S.phase){S.phase.k='done';S.phase.n=S.sel.size;render()}},500);return}
  if(a==='pcontinueany'){S.phase.k='done';S.phase.n=S.sel.size-1;render();return}
  if(a==='pgo'){if(S.inst==='navfail'&&!S.navUsed){S.navUsed=true;S.phase.k='navfail'}else{S.notice={text:'Continued to Project guidance (prototype stub).'};S.phase=null}render();return}
  if(a==='pnavretry'){S.phase.k='done';render();return}
  if(a==='isearch'){if(S.draft&&S.draft.loc===t.dataset.loc&&S.draft.dirty){S.confirm={fn:()=>{S.draft=null;S.confirm=null;document.querySelector(`[data-act="isearch"][data-loc="${t.dataset.loc}"]`)?.click()}};render();document.getElementById('cfk')?.focus();return}S.isearch={loc:t.dataset.loc,item:t.dataset.item,q:model().items.find(x=>x.id===t.dataset.item).name,phase:'idle'};S.draft&&S.draft.loc===t.dataset.loc&&(S.draft=null);render();document.getElementById('isq')?.focus();return}
  if(a==='gsearch'){S.isearch={loc:'global:',item:null,q:'',phase:'idle'};render();document.getElementById('isq')?.focus();return}
  if(a==='isubmit'){const q=document.getElementById('isq');if(q)S.isearch.q=q.value;S.isearch.phase='loading';const tok=++TOKEN;render();
    setTimeout(()=>{if(!S.isearch||TOKEN!==tok)return;S.isearch.phase=S.sout;render();document.getElementById('isq')?.focus()},600);return}
  if(a==='iclear'){S.isearch.q='';S.isearch.phase='idle';render();document.getElementById('isq')?.focus();return}
  if(a==='iclose'){const loc=S.isearch.loc;S.isearch=null;TOKEN++;render();document.querySelector(`[data-oid="${loc}${loc.endsWith(':')?'':''}:s"]`)?.focus();return}
  if(a==='idraft'){const m=model(),i=m.items.find(x=>x.id===t.dataset.item);replaceDraft(()=>{S.isearch&&S.isearch.loc===t.dataset.loc&&(S.isearch=null);openDraft(t.dataset.loc,[i],nameFromItem(i.name),t.dataset.oid)});return}
  if(a==='bdraft'){const m=model(),g=m.items.filter(i=>i.o.some(o=>o.p===t.dataset.prop));const bw=g.map(i=>(i.o.find(o=>o.p===t.dataset.prop)||{}).why).find(Boolean);replaceDraft(()=>openDraft(t.dataset.loc,g,PROPS[t.dataset.prop].name,t.dataset.oid,bw));return}
  if(a==='manualdraft'){replaceDraft(()=>{S.confirm=null;S.draft={loc:'manual',items:[{name:'',ev:''}],token:++TOKEN,opener:t.dataset.oid,name:'',description:'',content:'',status:'manual',manual:true,why:''};render();focusDn()});return}
  if(a==='regen'){const d=S.draft;replaceDraft(()=>openDraft(d.loc,d.items,d.name,d.opener,d.src));return}
  if(a==='showAllCands'){S.vf=null;S.filter='all';render();return}
  if(a==='cfok'){const f=S.confirm&&S.confirm.fn;S.confirm=null;if(f)f();return}
  if(a==='cfno'){S.confirm=null;render();document.getElementById('dn')?.focus();return}
  if(a==='createSkill'){const d=S.draft,tok=d.token;if(d.status==='creating')return;const subPath=pathOf(slugOf(d.name));d.status='creating';render();
    setTimeout(()=>{if(!S.draft||S.draft.token!==tok)return;if(S.create==='ok'){d.status='created';d.path=subPath}else d.status='createfail';render();announce(S.create==='ok'?'Skill created':'Could not create skill')},600);return}
  if(a==='closeDraft'){closeDraft();return}
  if(a==='draftMode'){const d=S.draft;if(!d||d.status==='creating')return;d.mode=d.mode==='edit'?'read':'edit';render();(document.getElementById(d.mode==='edit'?'dn':'pvh'))?.focus();return}
  if(t.dataset.pick){const n=t.dataset.pick;if(S.sel.has(n)){S.sel.delete(n)}else{S.sel.add(n);const lk=S.isearch&&S.isearch.item;if(SEARCHED[n]&&lk)S.manual[n]=[lk]}
    const y=window.scrollY;render();window.scrollTo(0,y);document.querySelector(`[data-pick="${CSS.escape(n)}"]`)?.focus();return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.allow){const p=S.phase;t.checked?p.allow.add(t.dataset.allow):p.allow.delete(t.dataset.allow);const ok=[...S.sel].filter(k=>(candOf(k).scripts||[]).length).every(k=>p.allow.has(k));const b=document.querySelector('[data-act="pinstall"]');if(b){b.disabled=!ok;b.setAttribute('aria-disabled',String(!ok))}return}
  if(t.dataset.act==='pickProv'){S.pick={prov:t.value,model:''};S.signStep=false;render();document.getElementById('pv')?.focus();return}
  if(t.dataset.act==='pickModel'&&t.value){const prov=(S.pick&&S.pick.prov)||(S.setup&&S.setup.prov);
    commit({prov,model:t.value},`Setup saved: ${pn(prov)} / ${t.value}.`);S.seed='';render();document.getElementById('setupCell')?.focus();announce('Setup saved')}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.draft){if(S.draft.status==='creating')return;S.draft.dirty=true;S.draft[t.dataset.draft]=t.value;if(S.draft.status==='created'||S.draft.status==='createfail')S.draft.status=S.draft.manual?'manual':'ready';refreshDerived()}
  if(t.dataset.isq!==undefined&&S.isearch)S.isearch.q=t.value});
const qs=new URLSearchParams(location.search);
['theme','w','surface','state','gen','create','inst','sout','railMode'].forEach(k=>{if(qs.get(k))S[k]=qs.get(k)});
if(qs.get('theme')==='light')S.theme='ptah-glass-light';
if(qs.get('theme')==='dark')S.theme='ptah-glass';
if(qs.get('shot')==='1')document.body.classList.add('shot');
if(!STATES[S.surface])S.surface='skills';
if(!STATES[S.surface].some(x=>x[0]===S.state))S.state=STATES[S.surface][S.surface==='skills'?1:0][0];
if(qs.get('seed')&&SEEDS.some(x=>x[0]===qs.get('seed')))seedPair(qs.get('seed'));
S._init=null;
render();
window.PT={S,render,openDraft,model,seedPair,startInstall,PROV};
</script>
