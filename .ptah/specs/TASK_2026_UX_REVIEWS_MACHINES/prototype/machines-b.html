<!doctype html><html lang="en" data-theme="anubis" data-theme-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machines · Fleet</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css"><link rel="stylesheet" href="tokens.css"><style>.tile:hover{background:var(--surface-3)}@media(max-width:767px){.machine-grid{grid-template-columns:1fr!important}}</style></head><body class="surface-0"><main class="p-4 md:p-6 max-w-[1600px] mx-auto"><header class="flex flex-wrap items-center gap-3 mb-4"><div class="mr-auto"><h1 class="text-lg font-semibold tracking-tight">Machines</h1><p class="text-xs text-base-content-muted">1 of 4 connected · 1 approval waiting</p></div><button class="btn btn-sm btn-primary">Add machine</button><button id="theme" class="btn btn-sm btn-ghost" aria-pressed="false">Light theme</button><div class="join" aria-label="Sample state"><button class="btn btn-sm join-item state-button" data-state="main">Main</button><button class="btn btn-sm join-item state-button" data-state="empty">Empty</button><button class="btn btn-sm join-item state-button" data-state="error">Error</button></div></header><div id="main"><section class="surface-1 p-5 mb-4"><div class="flex flex-wrap items-center gap-3"><h2 class="text-sm font-semibold">Approval waiting</h2><span class="text-xs text-base-content-muted">build-01</span><span class="badge badge-outline state-need">42 s left of 60 s</span><span class="text-sm font-medium">Bash</span><code class="font-mono text-xs">npm test</code><div class="grow"></div><button class="btn btn-sm btn-primary">Allow once</button><button class="btn btn-sm btn-outline">Deny</button></div></section><section><div class="flex items-center gap-3 mb-4"><h2 class="text-sm font-semibold mr-auto">Fleet</h2><input class="input input-bordered input-sm max-w-[240px] w-full" aria-label="Search machines" placeholder="Search machines"></div><div class="machine-grid grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4" role="listbox" aria-label="Machines"><button role="option" aria-selected="false" class="tile surface-1 p-5 text-left min-h-10"><span class="text-sm font-medium block mb-3">build-01</span><span class="state-done text-xs flex items-center gap-2 mb-3"><span class="status-dot"></span>Connected</span><span class="text-xs text-base-content-muted block">ptah 1.42 · protocol 7</span><span class="text-xs text-base-content-muted block">3 sessions · readiness 7 of 7 passed</span></button><button role="option" aria-selected="false" class="tile surface-1 p-5 text-left min-h-10"><span class="text-sm font-medium block mb-3">laptop</span><span class="state-run text-xs flex items-center gap-2 mb-3"><span class="status-ring"></span>Reconnecting</span><span class="text-xs text-base-content-muted block">ptah 1.42 · protocol 7</span><span class="text-xs text-base-content-muted block">1 session · last seen 20 s ago</span></button><button role="option" aria-selected="false" class="tile surface-1 p-5 text-left min-h-10"><span class="text-sm font-medium block mb-3">gpu-box</span><span class="state-idle text-xs flex items-center gap-2 mb-3"><span class="status-hollow"></span>Offline</span><span class="text-xs text-base-content-muted block">ptah 1.42 · protocol 7</span><span class="text-xs text-base-content-muted block">Last seen 5 min ago</span><span class="text-xs text-base-content-muted block mt-3">Retry now available in machine detail</span></button><button role="option" aria-selected="false" class="tile surface-1 p-5 text-left min-h-10"><span class="text-sm font-medium block mb-3">staging-02</span><span class="state-need text-xs flex items-center gap-2 mb-3"><span class="status-triangle"></span>Version mismatch</span><span class="text-xs text-base-content-muted block">ptah 1.41 · protocol 6</span><span class="text-xs text-base-content-muted block">Update the machine to connect</span></button></div></section></div><section id="empty" class="surface-1 p-5 hidden"><h2 class="text-sm font-semibold mb-3">No machines yet</h2><p class="text-sm mb-4">Add a machine to run sessions on a remote workspace.</p><div class="flex gap-2"><button class="btn btn-sm btn-primary">Add machine</button><button class="btn btn-sm btn-ghost">What is checked?</button></div></section><section id="error" class="surface-1 p-5 hidden" role="alert"><h2 class="text-sm font-semibold state-err mb-3">Machines could not be loaded</h2><p class="text-sm mb-4">The machine service did not respond. Check the connection and try again.</p><button class="btn btn-sm btn-primary">Try again</button></section></main><script>const q=new URLSearchParams(location.search),html=document.documentElement;function sync(){const light=q.get('theme')==='light',state=['main','empty','error'].includes(q.get('state'))?q.get('state'):'main';html.dataset.theme=light?'anubis-light':'anubis';html.dataset.themeMode=light?'light':'dark';document.getElementById('theme').textContent=light?'Dark theme':'Light theme';document.getElementById('theme').setAttribute('aria-pressed',String(light));['main','empty','error'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==state));document.querySelectorAll('.state-button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)))}document.getElementById('theme').onclick=()=>{q.set('theme',q.get('theme')==='light'?'dark':'light');history.replaceState(null,'','?'+q);sync()};document.querySelectorAll('.state-button').forEach(b=>b.onclick=()=>{q.set('state',b.dataset.state);history.replaceState(null,'','?'+q);sync()});sync();</script></body></html>
