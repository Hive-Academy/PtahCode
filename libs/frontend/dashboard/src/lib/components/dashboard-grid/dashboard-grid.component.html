<div class="dashboard-page min-h-full bg-surface-0" data-testid="dashboard-grid">
  <ptah-page-header
    title="Dashboard"
    description="Usage, plan limits and spend across your providers"
    backLabel="Back to chat"
    (back)="navigateBack()"
  >
    <ptah-dashboard-toolbar actions />
  </ptah-page-header>

  <div class="mx-auto flex w-full max-w-[1400px] flex-col gap-ptah-section p-ptah-surface">
    <ptah-usage-dashboard>
      <ptah-plan-limits-panel dashboardLimits />
    </ptah-usage-dashboard>

    <div class="dashboard-secondary grid grid-cols-1 gap-ptah-section" data-testid="dashboard-secondary">
      <ptah-skill-selection-card />
      <ptah-builders-card />
    </div>
  </div>
</div>
